<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arcana Privada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#120B1C;color:#FFF9F1;font-family:Arial,sans-serif}
body{min-height:100vh}
.app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:#120B1C;position:relative;padding-bottom:84px}
.top{height:74px;padding:18px 20px;border-bottom:1px solid #382547;display:flex;justify-content:space-between;align-items:center}
.brand{color:#E9C46A;font-weight:800;letter-spacing:2px;font-size:17px}
.cap{color:#BEB3C8;font-size:10px;margin-top:4px}
.av{width:36px;height:36px;border:1px solid #E9C46A;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#E9C46A;font-weight:800}
.content{padding:18px}
.hero{padding:22px;border-radius:24px;background:linear-gradient(145deg,#29183A,#1E132B);border:1px solid #4A315E}
.ey{font-size:10px;color:#E9C46A;font-weight:800;letter-spacing:1.4px}
.hero h1{font-size:29px;line-height:34px;margin:10px 0 8px}
.hero p,.sub,.muted{color:#BEB3C8;font-size:12px;line-height:18px}
.btn{margin-top:16px;background:#E9C46A;color:#211429;font-weight:900;text-align:center;padding:14px;border-radius:14px;cursor:pointer;user-select:none}
.btn:active{transform:scale(.99)}
.section{font-size:18px;font-weight:800;margin:24px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick,.panel,.consult{background:#1E132B;border:1px solid #352445;border-radius:18px;padding:15px}
.quick{min-height:116px}
.ico{color:#E9C46A;font-size:25px}
.title{font-weight:800;margin-top:8px}
.panel{margin-top:10px}
.badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{font-size:10px;color:#E9C46A;background:#332043;padding:6px 10px;border-radius:20px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:75px;background:#160D20;display:flex;border-top:1px solid #382547;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.ni{width:20%;display:flex;align-items:center;justify-content:center;color:#BEB3C8;font-size:10px;text-align:center;padding-top:6px;cursor:pointer;user-select:none}
.ni.active{color:#E9C46A}
.ni span{display:block;font-size:20px;margin-bottom:2px}
.page h1{font-size:28px;margin:0 0 6px}
.deck{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.card{width:104px;height:164px;border-radius:16px;border:1px solid #65437A;background:linear-gradient(160deg,#241431,#352045);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.card.active{border:2px solid #E9C46A;box-shadow:0 0 0 1px rgba(233,196,106,.15)}
.sym{font-size:38px;color:#E9C46A}
.name{font-size:9px;font-weight:800;margin-top:14px}
.consult{display:flex;align-items:center;margin-top:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#53D8A6;margin-right:12px}
.grow{flex:1}
.arrow{font-size:24px;color:#E9C46A}
.placeholder{padding:34px 18px;text-align:center}
.placeholder .ico{font-size:42px}
@media(max-width:360px){
  .hero h1{font-size:25px;line-height:30px}
  .content{padding:14px}
  .card{width:96px;height:152px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
(function(){
  function getView(){
    var s = window.location.search || "";
    var m = /[?&]view=([^&]+)/.exec(s);
    return m ? decodeURIComponent(m[1]) : "home";
  }

  function go(view){
    window.location.href = "index.html?view=" + encodeURIComponent(view);
  }

  function nav(view){
    return '<div class="nav">' +
      '<div class="ni '+(view==="home"?"active":"")+'" onclick="window.appGo(\'home\')"><div><span>⌂</span>Inicio</div></div>' +
      '<div class="ni '+(view==="spread"?"active":"")+'" onclick="window.appGo(\'spread\')"><div><span>✦</span>Tirada</div></div>' +
      '<div class="ni '+(view==="consultas"?"active":"")+'" onclick="window.appGo(\'consultas\')"><div><span>✉</span>Consultas</div></div>' +
      '<div class="ni '+(view==="live"?"active":"")+'" onclick="window.appGo(\'live\')"><div><span>◉</span>En vivo</div></div>' +
      '<div class="ni '+(view==="agenda"?"active":"")+'" onclick="window.appGo(\'agenda\')"><div><span>▣</span>Agenda</div></div>' +
    '</div>';
  }

  var top = '<div class="top"><div><div class="brand">ARCANA PRIVADA</div><div class="cap">Tarot · Consultas privadas</div></div><div class="av">A</div></div>';

  var home =
    '<div class="content">' +
      '<div class="hero">' +
        '<div class="ey">TU ESPACIO DE CONSULTA</div>' +
        '<h1>Una experiencia de tarot íntima y profesional.</h1>' +
        '<p>Recibí consultas, imágenes, reservas y sesiones en vivo desde un mismo lugar.</p>' +
        '<div class="btn" onclick="window.appGo(\'spread\')">Comenzar una tirada</div>' +
      '</div>' +
      '<div class="section">Accesos rápidos</div>' +
      '<div class="grid">' +
        '<div class="quick"><div class="ico">▧</div><div class="title">Subir imágenes</div><div class="muted">Fotos de cartas o consulta</div></div>' +
        '<div class="quick" onclick="window.appGo(\'live\')"><div class="ico">◉</div><div class="title">Sesión en vivo</div><div class="muted">Consulta privada</div></div>' +
        '<div class="quick" onclick="window.appGo(\'agenda\')"><div class="ico">◷</div><div class="title">Reservas</div><div class="muted">Turnos y disponibilidad</div></div>' +
        '<div class="quick" onclick="window.appGo(\'consultas\')"><div class="ico">♡</div><div class="title">Clientas</div><div class="muted">Historial y seguimiento</div></div>' +
      '</div>' +
      '<div class="section">Hoy</div>' +
      '<div class="panel"><div class="title">3 consultas programadas</div><div class="muted">Próxima sesión · 21:30 · Lectura profunda</div><div class="badges"><div class="badge">2 pendientes</div><div class="badge">1 confirmada</div></div></div>' +
    '</div>';

  var spread =
    '<div class="content page">' +
      '<h1>Tirada de 3 cartas</h1>' +
      '<div class="sub">Elegí tres cartas. En la versión comercial podrás usar tus propios mazos.</div>' +
      '<div class="deck">' +
        '<div class="card active"><div class="sym">☀</div><div class="name">EL SOL</div></div>' +
        '<div class="card active"><div class="sym">☾</div><div class="name">LA LUNA</div></div>' +
        '<div class="card"><div class="sym">★</div><div class="name">ARCANA</div></div>' +
        '<div class="card active"><div class="sym">♛</div><div class="name">LA EMPERATRIZ</div></div>' +
        '<div class="card"><div class="sym">⚖</div><div class="name">ARCANA</div></div>' +
      '</div>' +
      '<div class="panel"><div class="title">3/3 seleccionadas</div><div class="muted">El Sol · La Luna · La Emperatriz</div></div>' +
      '<div class="btn" onclick="alert(\'Interpretación de prueba creada correctamente\')">Crear interpretación</div>' +
      '<div class="section">Consulta asociada</div>' +
      '<div class="consult"><div class="dot"></div><div class="grow"><div class="title">Mariana · Amor y vínculos</div><div class="muted">2 imágenes adjuntas</div></div><div class="arrow">›</div></div>' +
    '</div>';

  function placeholder(icon,title,text){
    return '<div class="content page"><div class="placeholder"><div class="ico">'+icon+'</div><h1>'+title+'</h1><div class="sub">'+text+'</div></div></div>';
  }

  window.appGo = go;

  var view = getView();
  var content = home;
  if(view === "spread") content = spread;
  else if(view === "consultas") content = placeholder("✉","Consultas","Acá aparecerán las consultas privadas y el historial de tus clientas.");
  else if(view === "live") content = placeholder("◉","En vivo","Acá podrás iniciar y administrar tus sesiones de tarot en vivo.");
  else if(view === "agenda") content = placeholder("◷","Agenda","Acá podrás administrar reservas, fechas y disponibilidad.");

  var root = document.getElementById("app");
  if(root){
    root.innerHTML = top + content + nav(view);
  }
})();
</script>
</body>
</html>
